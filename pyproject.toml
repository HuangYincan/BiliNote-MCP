[project]
name = "bilinote-mcp"
version = "0.1.0"
description = "BiliNote 能力 MCP 封装：视频链接 → AI Markdown 笔记（内嵌下载/转写/LLM 流水线，无需启动 FastAPI 后端）"
readme = "README.md"
# 上界 3.14：av / faster-whisper(ctranslate2) 等目前尚未提供 3.14 wheel
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "HuangYincan" }]

# 运行时依赖：由 vendored 模块的实际 import 图确定（backend/requirements.txt 裁剪而来）。
# 已去掉：FastAPI/uvicorn/starlette、chromadb（无 RAG）、celery/kombu/redis、导出栈
# （weasyprint/pdfkit/python-docx/markdown_pdf/PyMuPDF）、gmssl/pycryptodomex/bs4/lxml（下载器未用）。
dependencies = [
    "fastmcp>=2.0",
    # 转写完成事件（events/，blinker 信号）
    "blinker>=1.9.0",
    "yt-dlp>=2025.3.31",
    "openai>=1.70.0",
    "faster-whisper>=1.1.1",
    "ffmpeg-python>=0.2.0",
    "huggingface_hub>=0.30.0",
    "httpx>=0.28.1",
    "av>=14.2.0",
    "pillow>=11.0.0",
    "pydantic>=2.11.2",
    "python-dotenv>=1.1.0",
    "requests>=2.32.3",
    "SQLAlchemy>=2.0.41",
    "youtube-transcript-api>=1.0.0",
    # 抖音 ABogus 签名（douyin_helper/abogus.py）
    "gmssl>=3.2.2",
]

[project.optional-dependencies]
# macOS 本地转写（MLX Whisper）可选
mlx = ["mlx-whisper"]

[project.scripts]
bilinote-mcp = "bilinote_mcp.server:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 用显式 glob 而非 packages：hatchling 的 packages 递归会漏掉 vendored 的深层子包
# （如 app/db/models），glob 确保 app/、events/、bilinote_mcp/ 全部被打进 wheel
include = ["bilinote_mcp/**", "app/**", "events/**"]
